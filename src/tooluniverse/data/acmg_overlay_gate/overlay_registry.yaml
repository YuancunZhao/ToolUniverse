- criterion_group: evidence_compatibility_resolution
  compatibility_criteria:
  - BA1
  - BS1
  - BS2
  - BP1
  - BP3
  - BP4
  - BP5
  - BP7
  - BS3
  - BS4
  - PM1
  - PM2
  - PM3
  - PM4
  - PM5
  - PM6
  - PP1
  - PP2
  - PP3
  - PP4
  - PP5
  - PS1
  - PS2
  - PS3
  - PS4
  - PVS1
  overlay_skill: tooluniverse-acmg-overlay-routing-core
  trigger_policy: universal_baseline
  applies_when:
  - final_counted_evidence_before_combination
  - route_audit_complete
  - current_counted_evidence_present
  baseline_data_sources:
  - route audit
  - overlay results
  - consumed evidence records
  - source assertions/leads
  - disease/mechanism context
  candidate_triggers:
  - final counted evidence is ready for ACMG qualitative combination
  - final counted evidence is ready for Tavtigian Bayesian combination
  - two or more counted items consume the same primary evidence, proband, assay, source label, disease context, mechanism, transcript consequence, or regional feature
  - counted items require mutually exclusive criterion selection, context split, cap, or VCEP-specific compatibility handling
  notes:
  - This is a final-combine compatibility gate, not a new ACMG evidence criterion.
  - It keeps, drops, caps, splits, or blocks already-routed evidence.
  - Only current_counted_evidence_resolved may enter qualitative ACMG combine or Bayesian combine.
  enforcement_level: must_audit_if_counted
  route_kind: compatibility_gate
  expected_default_status: not_assessed
