---
version: '2026-06-18'
registry_name: tooluniverse-acmg-overlay-skill-gate
description: 'Maps ACMG evidence routes to mandatory ToolUniverse overlay skills. Baseline routes are planned before evidence assignment; discovery routes are appended after literature, clinical, database, or user-supplied evidence creates a candidate signal. Candidate detection means "route for adjudication", not "evidence is met".

'
controlled_values:
  trigger_policy_values:
  - universal_baseline
  - variant_type_baseline
  - evidence_discovery
  allowed_route_outcomes:
  - overlay_applied
  - overlay_not_applicable
  - overlay_not_assessed
  - overlay_deferred_to_vcep
  countable_route_outcomes:
  - overlay_applied
  - overlay_deferred_to_vcep
  status_values:
  - applied
  - no_evidence
  - not_assessed
  - not_applicable
  - not_used
  guidance_authority_values:
  - ClinGen/SVI primary
  - ACMG/AMP baseline
  - VCEP-specific
  - practice/local refinement
  - source lead only
  enforcement_level_values:
  - must_plan
  - must_query
  - must_route_if_hit
  - must_audit_if_counted
  route_kind_values:
  - applicability_gate
  - evidence_intake
  - evidence_scoring
  - source_review
  - functional_discovery
  - compatibility_gate
  query_status_values:
  - success
  - no_hit
  - unavailable
  - failed
  - not_applicable
  source_category_values:
  - population
  - computational
  - source_assertion
  - literature
  - functional_database
  - disease_context
  - mechanism_context
  - clinical_context
  - route_audit
  - compatibility
defaults:
  mandatory: true
  blocks_direct_assignment: true
  required_trace_fields:
  - criterion
  - overlay_skill
  - route_outcome
  - trigger_policy
  - status
  - guidance_authority
  - reason
  - consumed_evidence
  - source_of_truth
  - enforcement_level
  - route_kind
  allowed_route_outcomes:
  - overlay_applied
  - overlay_not_applicable
  - overlay_not_assessed
  - overlay_deferred_to_vcep
  countable_route_outcomes:
  - overlay_applied
  - overlay_deferred_to_vcep
  compatibility_resolution_values:
  - keep_more_specific
  - keep_primary_evidence
  - keep_mechanism_appropriate
  - drop_as_not_used
  - cap_combined_strength
  - split_by_context
  - defer_to_vcep
  - unresolved_draft_only
criterion_ownership:
