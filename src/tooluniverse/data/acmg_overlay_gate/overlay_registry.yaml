  - PS4
  - PP1
  - BS4
  - PP4
  - PM3
  - BA1
  - BS1
  - PM2
  - PS2
  - PM6
  overlay_skill: tooluniverse-acmg-multiple-disorder-context-refinement
  trigger_policy: universal_baseline
  applies_when:
