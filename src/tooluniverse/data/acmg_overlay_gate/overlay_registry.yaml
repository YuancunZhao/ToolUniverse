  - stop_loss
  - protein_length_change
  - repeat_or_low_complexity_region
  baseline_data_sources:
  - VEP
  - UniProt
  - InterPro
  - protein sequence/context
  candidate_triggers:
  - in-frame deletion, in-frame insertion, single amino-acid indel, repeat region, low-complexity region, stop-loss, or altered-product context
  - protein length change proposed as PM4 or BP3
  - PVS1 versus PM4 boundary needs resolution
  - repeat-region benign evidence or last-exon altered-product evidence
