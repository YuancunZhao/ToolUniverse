  - pvs1_lof_decision_tree
  - pvs1_splicing
  PS1:
  - ps1_pm5_amino_acid_equivalence
  - ps1_splicing_similarity
  PS2:
  - de_novo_ps2_pm6
  PS3:
  - ps3_bs3_functional_assay
  PS4:
