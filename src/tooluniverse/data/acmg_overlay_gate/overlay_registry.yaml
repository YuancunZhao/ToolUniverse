  - phase_data_available
  - recessive_context
  baseline_data_sources:
  - ClinVar
  - literature
  - patient genotype/phase
  candidate_triggers:
  - recessive disease with biallelic observations
  - in trans, phase unknown, one-parent-supported, homozygous, or compound heterozygous evidence
  - VUS on the other allele or PM3 point scoring
  - proband phase, genotype, or circularity affects recessive evidence
  - user context mentions compound heterozygous, in trans, phase confirmed, biallelic, or recessive affected proband evidence
  enforcement_level: must_route_if_hit
  route_kind: evidence_scoring
  expected_default_status: not_assessed
  hit_trigger_evidence_types:
  - biallelic observation
  - in-trans evidence
  - phase data
  - compound heterozygous evidence
  - homozygous recessive observation
- criterion_group: de_novo_ps2_pm6
  covered_criteria:
  - PS2
  - PM6
  overlay_skill: tooluniverse-acmg-de-novo-evidence-refinement
  trigger_policy: evidence_discovery
  applies_when:
  - de_novo_or_trio_evidence_found
  - parental_testing_available
  baseline_data_sources:
  - literature
  - ClinVar submissions
  - user trio data
  candidate_triggers:
  - de novo, presumed de novo, maternity or paternity confirmation, or parental testing evidence
  - PS2, PM6, recurrent de novo, phenotype specificity, or SVI de novo point scoring
  - trio data, family data, or literature case data propose de novo evidence
  - inheritance model or phenotype specificity affects de novo strength
  - user context mentions de novo, trio, parents negative, maternity/paternity confirmed, parentage confirmed, or parental mosaicism
  enforcement_level: must_route_if_hit
  route_kind: evidence_scoring
  expected_default_status: not_assessed
  hit_trigger_evidence_types:
  - de novo evidence
  - trio evidence
  - parental testing
  - parentage confirmation
