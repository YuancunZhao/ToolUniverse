overlays:
- criterion_group: ba1_exception_list
  covered_criteria:
  - BA1
  overlay_skill: tooluniverse-acmg-ba1-exception-list-refinement
  trigger_policy: universal_baseline
  applies_when:
  - germline_assessment
  - population_frequency_available
  - high_frequency_or_ba1_candidate
  baseline_data_sources:
  - gnomAD
  - Ensembl variation
  - MyVariant
  - ClinVar allele frequency
  - TOPMed
  candidate_triggers:
  - allele frequency near or above BA1 stand-alone thresholds
  - high-frequency population observation in gnomAD, ExAC, 1000 Genomes, or cohort data
  - mention of BA1, stand-alone benign, or BA1 exception list
  - founder or continental population frequency used as benign evidence
  enforcement_level: must_query
  route_kind: evidence_scoring
  expected_default_status: not_assessed
- criterion_group: benign_context
  covered_criteria:
  - BA1
  - BS1
  - BS2
  - BP2
  - BP5
  overlay_skill: tooluniverse-acmg-benign-context-refinement
  trigger_policy: universal_baseline
  applies_when:
  - germline_assessment
  - benign_frequency_or_context_gate
  - patient_or_source_context_if_available
  baseline_data_sources:
  - gnomAD
  - ClinGen disease context
  - GenCC
  - ClinVar
  - user phenotype/context when supplied
  candidate_triggers:
  - population frequency proposed as benign evidence below or outside BA1
  - healthy adult carriers or unaffected individuals
  - cis/trans benign phase evidence
  - alternate molecular diagnosis proposed to explain the phenotype
  - user context mentions unaffected adult carrier, healthy homozygote, observed in unaffected, alternate diagnosis, another molecular diagnosis, cis, trans, or phase evidence
  - BA1 blocked but frequency may still support BS1
  cross_routes:
  - criterion: BP1
    route_to: pm1_regional_missense_constraint
    reason: BP1 is benign evidence but depends on missense disease mechanism and PM1/PP2/BP1 priority; do not include BP1 in benign_context covered_criteria.
  enforcement_level: must_query
  route_kind: evidence_scoring
  expected_default_status: not_assessed
- criterion_group: pm2_absence_rarity
  covered_criteria:
  - PM2
  overlay_skill: tooluniverse-acmg-pm2-absence-rarity-refinement
  trigger_policy: universal_baseline
  applies_when:
  - germline_assessment
  - population_frequency_available_or_queryable
  baseline_data_sources:
  - gnomAD
  - Ensembl variation
  - MyVariant
  - ClinVar
  - TOPMed
  candidate_triggers:
  - absence, rarity, or extremely low allele count in population databases
  - PM2, PM2_Supporting, absent from gnomAD, or rare in controls
  - population database coverage or ancestry adequacy affects pathogenic evidence
  - BA1, BS1, or BS2 may override population-rarity evidence
  enforcement_level: must_query
  route_kind: evidence_scoring
  expected_default_status: not_assessed
- criterion_group: pp3_bp4_missense_prediction
  covered_criteria:
  - PP3
  - BP4
  overlay_skill: tooluniverse-acmg-pp3-bp4-missense-prediction-refinement
  trigger_policy: variant_type_baseline
  applies_when:
  - missense_variant
  - protein_altering_variant_with_calibrated_predictor_available
  - vcep_prediction_rule_available
  baseline_data_sources:
  - VEP
  - MyVariant/dbNSFP
  - REVEL
  - AlphaMissense
  - CADD
  - SIFT
  - PolyPhen
  candidate_triggers:
  - missense computational pathogenicity or benign prediction evidence
  - REVEL, BayesDel, AlphaMissense, CADD, SIFT, PolyPhen, VEST, MetaSVM, or similar scores
  - predictor concordance, predictor majority, deleterious prediction, or tolerated prediction
  - VCEP or calibrated prediction threshold may apply
  enforcement_level: must_query
  route_kind: evidence_scoring
  expected_default_status: not_assessed
- criterion_group: ps1_pm5_amino_acid_equivalence
  covered_criteria:
  - PS1
  - PM5
  overlay_skill: tooluniverse-acmg-ps1-pm5-amino-acid-equivalence-refinement
  trigger_policy: variant_type_baseline
  applies_when:
  - missense_variant
  - protein_substitution
  - comparison_variant_queryable
  baseline_data_sources:
  - ClinVar
  - MyVariant
  - HGMD/LOVD if available
  - VEP colocated variants
  candidate_triggers:
  - same amino acid substitution as known pathogenic or likely pathogenic variant
  - different missense change at same residue or codon
  - ClinVar, HGMD, LOVD, VCEP, or paper comparison variant label proposed for PS1 or PM5
  - same-residue, same-codon, or amino-acid-mediated comparison evidence
  enforcement_level: must_query
  route_kind: evidence_scoring
  expected_default_status: not_assessed
- criterion_group: ps1_splicing_similarity
  covered_criteria:
  - PS1
  overlay_skill: tooluniverse-acmg-ps1-splicing-similarity-refinement
  trigger_policy: variant_type_baseline
  applies_when:
  - splice_region_variant
  - predicted_splicing_variant
  - same_event_comparison_queryable
  baseline_data_sources:
  - VEP
  - splice prediction
  - ClinVar comparison variants
  - RNA evidence if available
  candidate_triggers:
  - same predicted RNA splicing event as a known pathogenic or likely pathogenic variant
  - donor or acceptor motif comparison variant evidence
  - splice prediction used to compare two variants for PS1
  - Walker-style same-event splicing evidence
  enforcement_level: must_route_if_hit
  route_kind: evidence_scoring
  expected_default_status: not_assessed
  hit_trigger_evidence_types:
  - same predicted splicing event
  - splice comparison variant
  - VCEP splicing comparison rule
- criterion_group: pm1_regional_missense_constraint
  covered_criteria:
  - PM1
  - PP2
  - BP1
  overlay_skill: tooluniverse-acmg-pm1-regional-missense-constraint-refinement
  trigger_policy: variant_type_baseline
  applies_when:
  - missense_variant
  - protein_region_queryable
  - domain_or_constraint_context_available
  baseline_data_sources:
  - UniProt
  - InterPro
  - AlphaFold
  - gnomAD constraints
  - regional constraint literature
  candidate_triggers:
  - hotspot, critical residue, constrained subdomain, or functional domain evidence
  - regional missense depletion or regional constraint proposed as PM1
  - broad domain membership proposed as pathogenic evidence
  - missense mechanism evidence for PP2 or BP1
  enforcement_level: must_query
  route_kind: evidence_scoring
  expected_default_status: not_assessed
- criterion_group: pvs1_lof_decision_tree
  covered_criteria:
  - PVS1
  overlay_skill: tooluniverse-acmg-pvs1-lof-decision-tree-refinement
  trigger_policy: universal_baseline
  applies_when:
  - germline_assessment
  - pvs1_applicability_gate
  - lof_candidate_variant_if_present
  baseline_data_sources:
  - VEP
  - VariantValidator
  - ClinGen dosage
  - ClinGen gene validity
  - transcript structure
  candidate_triggers:
  - nonsense, frameshift, canonical splice, start-loss, exon deletion, exon duplication, or whole-gene deletion
  - predicted loss of function, haploinsufficiency, NMD, truncated protein, or LoFTEE evidence
  - PVS1, PVS1_Strong, PVS1_Moderate, PVS1_Supporting, or PVS1_N/A proposed
  - transcript structure or LoF mechanism determines evidence strength
  enforcement_level: must_plan
  route_kind: evidence_scoring
  expected_default_status: not_applicable
- criterion_group: pvs1_splicing
  covered_criteria:
  - PVS1
  - BP7
  overlay_skill: tooluniverse-acmg-pvs1-splicing-refinement
  trigger_policy: variant_type_baseline
  applies_when:
  - splice_region_variant
  - canonical_splice_variant
  - rna_splicing_evidence_available
  - observed_transcript_consequence_available
  baseline_data_sources:
  - VEP
  - splice prediction
  - RNA assays/literature when discovered
  candidate_triggers:
  - RNA assay, RT-PCR, minigene, exon skipping, aberrant transcript, or rescue transcript evidence
  - splicing evidence affects PVS1 or BP7 strength
  - Walker-style RNA/splicing refinement needed after baseline PVS1 branch
  - direct RNA evidence may supersede splice prediction evidence
  - published RNA-splicing evidence or observed transcript consequence is available
  notes:
  - SpliceAI-only or other prediction-only evidence is prediction/comparison context, not RNA assay evidence.
  - Route prediction-only splicing evidence to PP3/BP4 prediction guidance, PS1-splicing comparison guidance, or VCEP; do not trigger PVS1_RNA without RNA assay, published RNA evidence, or observed transcript consequence.
  enforcement_level: must_route_if_hit
  route_kind: evidence_scoring
  expected_default_status: not_assessed
  hit_trigger_evidence_types:
  - RNA assay
  - published RNA evidence
  - observed transcript consequence
- criterion_group: ps3_bs3_functional_assay
  covered_criteria:
  - PS3
  - BS3
  overlay_skill: tooluniverse-acmg-ps3-bs3-functional-assay-refinement
  trigger_policy: variant_type_baseline
  applies_when:
  - missense_variant
  - structured_functional_database_available
  - functional_literature_signal_present
  baseline_data_sources:
  - MaveDB
  - ProtVar
  - literature functional assay
  - ClinVar/HGMD source lead
  candidate_triggers:
  - functional assay, enzyme activity, cellular assay, rescue assay, minigene functional readout, or calibrated OddsPath
  - literature, ClinVar, HGMD, or author ACMG label refers to PS3 or BS3
  - experimental evidence proposed as functional support
  - assay controls, validation, disease-mechanism fit, or statistical calibration determine evidence strength
  - structured functional database hit such as MaveDB for a missense variant
  notes:
  - For missense variants, structured functional database lookup is a variant_type_baseline functional-discovery source.
  - Literature functional assays remain evidence_discovery signals; once found, they must be routed to the same overlay before counting.
  enforcement_level: must_query
  route_kind: evidence_scoring
  expected_default_status: not_assessed
  hit_trigger_evidence_types:
  - MaveDB hit
  - structured functional database hit
  - functional assay in literature
  - author PS3/BS3 code with assay details
- criterion_group: ps4_case_enrichment
  covered_criteria:
  - PS4
  overlay_skill: tooluniverse-acmg-ps4-case-enrichment-refinement
  trigger_policy: evidence_discovery
  applies_when:
  - case_control_or_cohort_evidence_found
  - case_series_or_recurrence_evidence_found
  - literature_signal_present
  baseline_data_sources:
  - literature search
  - ClinVar submissions as leads
  - cohort studies
  candidate_triggers:
  - case-control, cohort, meta-analysis, odds ratio, confidence interval, or case enrichment evidence
  - unrelated affected case series proposed as PS4 or rare-disease recurrence evidence
  - gnomAD or population controls used for enrichment comparison
  - disease case definition, ancestry matching, duplicate reports, or founder haplotypes affect scoring
  enforcement_level: must_route_if_hit
  route_kind: evidence_scoring
  expected_default_status: not_assessed
  hit_trigger_evidence_types:
  - case-control evidence
  - cohort evidence
  - meta-analysis
  - odds ratio/confidence interval
  - unrelated case series
  - recurrence evidence
- criterion_group: pp1_bs4_pp4_segregation
