  - segregation_or_cascade_screening_found
  - user_family_data_supplied
  baseline_data_sources:
  - literature search
  - full text
  - figure/table extraction
  - user pedigree
  candidate_triggers:
  - family, pedigree, co-segregation, segregation, non-segregation, meioses, affected relatives, or informative relatives
  - literature family series or figures with genotype-phenotype relationships
  - PP1, BS4, or PP4 locus evidence proposed from family data
  - diagnostic-yield PP4 and segregation evidence may share the same locus, family, or individuals
  - user context mentions segregation, affected relatives, co-segregation, pedigree, or cascade testing
  enforcement_level: must_route_if_hit
  route_kind: evidence_scoring
  expected_default_status: not_assessed
  hit_trigger_evidence_types:
  - pedigree
  - segregation
  - non-segregation
  - cascade screening
  - affected relatives
  - informative meioses
  - user family data
- criterion_group: pm3_in_trans
  covered_criteria:
  - PM3
  overlay_skill: tooluniverse-acmg-pm3-in-trans-refinement
  trigger_policy: evidence_discovery
  applies_when:
