  - PS1
  - PM5
  - PS3
  - BS3
  - PM1
  - PP2
  - BP1
  - PP3
  - PM4
  - PS4
  - PP1
  - BS4
  - PM3
  - PS2
  - PM6
  overlay_skill: tooluniverse-acmg-dominant-negative-mechanism-refinement
  trigger_policy: universal_baseline
  applies_when:
