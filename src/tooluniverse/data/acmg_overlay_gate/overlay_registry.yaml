  PM1:
  - pm1_regional_missense_constraint
  PM2:
  - pm2_absence_rarity
  PM3:
  - pm3_in_trans
  PM4:
  - pm4_bp3_protein_length
  PM5:
  - ps1_pm5_amino_acid_equivalence
  PM6:
  - de_novo_ps2_pm6
  PP1:
  - pp1_bs4_pp4_segregation
  PP2:
  - pm1_regional_missense_constraint
  PP3:
  - pp3_bp4_missense_prediction
  PP4:
  - pp1_bs4_pp4_segregation
  PP5:
  - reputable_source_review
  BA1:
  - ba1_exception_list
  - benign_context
  BS1:
  - benign_context
  BS2:
  - benign_context
  BS3:
  - ps3_bs3_functional_assay
  BS4:
  - pp1_bs4_pp4_segregation
  BP1:
  - pm1_regional_missense_constraint
  BP2:
  - benign_context
  BP3:
  - pm4_bp3_protein_length
  BP4:
  - pp3_bp4_missense_prediction
  BP5:
  - benign_context
  BP6:
  - reputable_source_review
  BP7:
