name: ACMG v3 release candidate

on:
  push:
    branches:
      - codex/acmg-on-tooluniverse-1.4
  workflow_dispatch:
    inputs:
      run_online_smoke:
        description: Run exact-SHA live ACMG provider checks
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  offline-candidate:
    name: Offline release gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project test and documentation dependencies
        run: uv sync --extra dev --extra docs --locked

      - name: Verify lock file and patch whitespace
        run: |
          uv lock --check
          git diff --check 089eb8e6308fc64ae5af3de4bfbec32b5cf07b61 HEAD

      - name: Lint ACMG release surface
        run: |
          uv run ruff check \
            src/tooluniverse/acmg \
            src/tooluniverse/acmg_runtime_tools.py \
            src/tooluniverse/clingen_tool.py \
            scripts/verify_acmg_install_smoke.py \
            scripts/verify_acmg_mcp_tool_registration.py \
            scripts/verify_acmg_skill_mirrors.py \
            tests/unit/test_acmg_*.py \
            tests/integration/test_acmg_*.py \
            tests/integration/test_coding_api_integration.py

      - name: Run non-network unit and integration tests
        run: |
          uv run pytest -q tests/unit tests/integration \
            -m "not slow and not require_api_keys and not network and not require_gpu"

      - name: Verify ACMG registration, schemas, wrappers, and Skill mirrors
        run: |
          uv run python scripts/verify_acmg_mcp_tool_registration.py
          uv run python scripts/verify_acmg_skill_mirrors.py

      - name: Verify local isolated install
        run: |
          uv run python scripts/verify_acmg_install_smoke.py \
            --source local \
            --expected-version 1.4.0+acmg.3

      - name: Build documentation and reject new ACMG-page warnings
        run: |
          uv run sphinx-build -b html -n \
            -w /tmp/tooluniverse-sphinx-warnings.log \
            docs docs/_build/acmg-release-candidate
          if grep -E "(acmg_evidence_collector|SETUP|TOOLUNIVERSE_OVERLAY_DIFF)" \
            /tmp/tooluniverse-sphinx-warnings.log; then
            echo "New warning found in an ACMG release page"
            exit 1
          fi

  online-candidate:
    name: Exact-SHA online provider gates
    needs: offline-candidate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_online_smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install test environment
        run: uv sync --extra dev --locked

      - name: Install and test the exact remote commit with live providers
        run: |
          uv run python scripts/verify_acmg_install_smoke.py \
            --source git-ref \
            --git-ref "${{ github.sha }}" \
            --repo-url "https://github.com/${{ github.repository }}.git" \
            --expected-version 1.4.0+acmg.3 \
            --online-providers
